# Semanal, domingo ~06h41 BRT: listas de depositárias (Banco B3, Bradesco), cadastro CVM e revisita completa de GetDetail.
name: etl-weekly

on:
  schedule:
    - cron: "41 9 * * 0"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset a atualizar"
        type: choice
        options: [all, acoes, bdrs, acoes_volume]
        default: all
      date:
        description: "Data de referência AAAA-MM-DD (vazio = hoje em Brasília)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/etl.yml
    with:
      dataset: ${{ inputs.dataset || 'all' }}
      weekly: true
      monthly: false
      date: ${{ inputs.date || '' }}
      timeout: 45
