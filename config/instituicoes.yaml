# Instituições canônicas: escrituradores (B3/CVM) e depositárias de BDR. FONTE ÚNICA de nomes, aliases, CNPJs e cores.
#
# - cnpjs: extraídos do campo CNPJ_Escriturador do FCA (2010-2026), nunca de memória. Só entram CNPJs cuja
#   instituição é a titular (o FCA tem CNPJs trocados entre empresas do mesmo grupo; ver docs/fontes.md).
# - aliases: nomes exatos, comparados sem acento/caixa/pontuação.
# - padroes: regex sobre o nome normalizado ("itau corretora de valores s a"), avaliados NA ORDEM DESTE ARQUIVO.
#   Por isso Itaú Corretora vem antes de Itaú Unibanco e Bradesco CTVM antes de Banco Bradesco.
# - cor: identidade de marca (tabela da seção 11.3 do prompt). cor_depositaria: cor usada no painel de BDRs quando
#   o seed usa outra (Itaú Unibanco). Nunca gerar cor aleatória.
# - ids reservados (não precisam de padrão): propria-empresa, nao-informado, nao-identificado.

- id: itau-corretora
  nome: Itaú Corretora de Valores S.A.
  nome_curto: Itaú Corretora
  cnpjs: ["61.194.353/0001-64"]
  padroes: ["itau (s a |sa )?corret", "itaucor", "iatucor"]
  cor: "#EC7000"
  papeis: [escriturador]

- id: itau-unibanco
  nome: Itaú Unibanco S.A.
  nome_curto: Itaú Unibanco
  cnpjs: ["60.701.190/0001-04"]
  padroes: ["banco itau", "itau unibanco", "itaubanco", "^itau s a$", "^itau sa$", "^itau$"]
  cor: "#F7A04B"
  cor_depositaria: "#EC7000"
  papeis: [escriturador, depositaria]

